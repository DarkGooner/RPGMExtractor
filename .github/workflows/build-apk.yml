name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship a licensed Android SDK with $ANDROID_HOME
      # already set in the shell environment. Write it into local.properties
      # so AGP can find it regardless of how the Gradle daemon is invoked.
      - name: Point Gradle at the preinstalled Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Accept Android SDK licenses
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          else
            echo "sdkmanager not on PATH; assuming licenses are already accepted on this runner image."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpgm-asset-extractor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
